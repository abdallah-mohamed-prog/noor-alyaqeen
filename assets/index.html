<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f5c5e"><title>نور اليقين</title><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="app.css"></head><body><script>try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})})}if(window.caches){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}}catch(e){}</script><div id="root"></div><script src="app.js"></script></body></html>
